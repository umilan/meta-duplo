[project]
name = "medorg"
version = "0.1.0"
description = "Local media organizer: duplicates, metadata harmonization and safe renaming (POC)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "imagehash>=4.3",
  "blake3>=0.4",
  "piexif>=1.1.3",
]

[project.optional-dependencies]
geo = ["reverse-geocoder>=1.5"]

[project.scripts]
medorg = "medorg.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
