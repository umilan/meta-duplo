[package]
name = "filomena"
version = "0.1.0"
description = "Filomena: photo and video dates, places, devices and duplicates (meta-duplo)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
strip = true
lto = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
