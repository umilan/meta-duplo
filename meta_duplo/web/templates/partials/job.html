{% if job %}
{% if job.status == 'running' %}
<div class="job" hx-get="/job?watch=1" hx-trigger="every 1s" hx-swap="outerHTML" role="status">
  <strong>{{ job.name|capitalize }}</strong>
  <span class="muted">{{ job.stage }}</span>
  <progress {% if job.total %}value="{{ job.done }}" max="{{ job.total }}"{% endif %}></progress>
  <span class="small muted">{% if job.total %}{{ job.done }} / {{ job.total }}{% endif %}</span>
</div>
{% elif job.status == 'failed' %}
<div class="job job--failed" role="alert"><strong>{{ job.name|capitalize }} failed.</strong> <span class="small mono">{{ (job.message or '')[:300] }}</span></div>
{% endif %}
{% endif %}
